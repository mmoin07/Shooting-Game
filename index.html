<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Arena Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-item">SCORE <span id="score">0</span></div>
        <div class="hud-item">WAVE <span id="wave">1</span></div>
      </div>
      <div class="hud-center">
        <div class="bar"><div id="health-bar"></div></div>
      </div>
      <div class="hud-right">
        <div class="hud-item">AMMO <span id="ammo">30</span>/<span id="ammo-max">30</span></div>
        <div class="hud-item" id="powerup-label"></div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>NEON <span>ARENA</span></h1>
      <p class="subtitle">Survive endless waves of enemies</p>
      <div class="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
        <div><kbd>Mouse</kbd> Aim &amp; Shoot</div>
        <div><kbd>R</kbd> Reload</div>
        <div><kbd>P</kbd> / <kbd>Esc</kbd> Pause</div>
      </div>
      <button id="start-btn">START GAME</button>
      <p class="best">Best score: <span id="best-start">0</span></p>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <h2>PAUSED</h2>
      <button id="resume-btn">RESUME</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h2>GAME OVER</h2>
      <p>Score: <span id="final-score">0</span></p>
      <p>Wave reached: <span id="final-wave">1</span></p>
      <p class="best">Best score: <span id="best-over">0</span></p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <div id="wave-banner" class="hidden"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
